<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>어반사이드 팝업 POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="app.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
<header class="top">
  <div class="top-in">
    <span class="brand">어반사이드 POS</span>
    <span class="mode" id="store-chip">—</span>
    <div class="top-meta">
      <span id="conn"><span class="dot"></span>연결 중</span>
      <span id="who"></span>
      <span id="clock" class="num"></span>
    </div>
  </div>
  <nav class="tabs" aria-label="화면" id="tabs"></nav>
  <div class="status-strip" id="strip">데이터를 불러오는 중이에요</div>
</header>
<main id="main">
  <div class="empty"><strong>데이터를 불러오는 중이에요</strong>잠시만 기다려 주세요.</div>
</main>
<div id="modal-root"></div>
<div id="toast" aria-live="polite"></div>
<script src="app.js?v=202611262116"></script>
</body>
</html>
